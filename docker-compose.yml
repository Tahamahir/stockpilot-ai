services:
  # =======================================================
  # Streamlit dashboard
  # =======================================================
  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile

    container_name: stockpilot-streamlit
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - "8501:8501"

    volumes:
      - ./streamlit:/app

  # =======================================================
  # StockPilot application database
  # =======================================================
  postgres:
    image: postgres:17-alpine
    container_name: stockpilot-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =======================================================
  # Airflow metadata database
  # =======================================================
  airflow-db:
    image: postgres:17-alpine
    container_name: stockpilot-airflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${AIRFLOW_DB_NAME}"
      POSTGRES_USER: "${AIRFLOW_DB_USER}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD}"

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =======================================================
  # dbt transformations
  # =======================================================
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile

    container_name: stockpilot-dbt

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DBNAME: "${POSTGRES_DB}"
      DBT_USER: "${POSTGRES_USER}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD}"
      DBT_SCHEMA: staging
      DBT_PROFILES_DIR: /usr/app/dbt

    working_dir: /usr/app/dbt

    volumes:
      - ./dbt:/usr/app/dbt

  # =======================================================
  # Airflow local development service
  # =======================================================
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: stockpilot-airflow
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      airflow-db:
        condition: service_healthy

    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DBNAME: "${POSTGRES_DB}"
      DBT_USER: "${POSTGRES_USER}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD}"
      DBT_SCHEMA: staging
      DBT_PROFILES_DIR: /opt/stockpilot/dbt

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

      AIRFLOW_CONN_STOCKPILOT_POSTGRES: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command: standalone

    ports:
      - "${AIRFLOW_PORT:-8080}:8080"

    volumes:
      - ./dbt:/opt/stockpilot/dbt:ro
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/stockpilot/data:ro

volumes:
  postgres_data:
    name: stockpilot-postgres-data

  airflow_db_data:
    name: stockpilot-airflow-db-data

  airflow_home:
    name: stockpilot-airflow-home